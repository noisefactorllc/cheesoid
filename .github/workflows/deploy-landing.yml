name: Deploy Landing Page

# Scaffold is the sole authority for cheesoid landing-page deploys.
# This workflow just fires the workflow_dispatch at scaffold's
# static-site-release, which clones this repo at the pushed SHA, stages
# index.html + cheesoid.svg, writes deployment-meta.json, and rsyncs to
# ~/sites/cheesoid.noisefactor.io/content on nf-toronto.
#
# Keeping the SSH key + server IP on the scaffold side means this
# public repo carries no deploy secrets — only the EHSRE app private
# key, which is scoped to dispatching scaffold workflows.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cheesoid.svg'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-scaffold-release:
    name: Dispatch scaffold static-site-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Mint scaffold GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: 2959521
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: scaffold

      - name: Dispatch scaffold static-site-release for cheesoid
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run static-site-release.yml \
            --repo noisefactorllc/scaffold \
            --ref main \
            -f site=cheesoid \
            -f sha=${{ github.sha }}
          echo "Dispatched scaffold static-site-release for cheesoid @ ${{ github.sha }}"
